name: Regression tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  macos-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Focused regression tests
        run: python -m unittest discover -s tests -p 'test_precision_regressions.py' -v
      - name: Full project self-check
        run: python tests/test_rdis.py
