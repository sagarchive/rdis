name: Hardening regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run hardening regressions
        run: python -m unittest discover -s tests -p 'test_hardening.py' -v
