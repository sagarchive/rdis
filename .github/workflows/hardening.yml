name: Hardening regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build wheel and verify packaged web assets
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              assert "rdis/web/index.html" in archive.namelist()
          PY
          python -m pip install --force-reinstall dist/*.whl
          rdis --help
          rdis-gui --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | rdis-mcp
      - name: Run hardening regressions
        run: python -m unittest discover -s tests -p 'test_hardening.py' -v

  macos-regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run full product self-check
        run: python tests/test_rdis.py
      - name: Run execution-checked decompiler maturity suite
        run: python tests/maturity.py
