name: Hardening regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Build wheel and verify packaged web assets
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")
          assert len(wheel) == 1, wheel
          with zipfile.ZipFile(wheel[0]) as archive:
              assert "rdis/web/index.html" in archive.namelist()
          PY
          python -m pip install --force-reinstall dist/*.whl
          rdis --help
          rdis-gui --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | rdis-mcp
      - name: Check embedded browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("rdis/web/index.html").read_text()
          scripts = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)
          assert scripts, "no inline application script found"
          Path("/tmp/rdis-inline.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/rdis-inline.js
      - name: Run hardening regressions
        run: python -m unittest discover -s tests -p 'test_hardening.py' -v

  cfg-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render real application CFG in desktop and mobile browsers
        run: node tests/cfg_browser_smoke.mjs
      - name: Upload CFG screenshots and standalone SVG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdis-cfg-browser-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  macos-regression:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run full product self-check
        run: python tests/test_rdis.py
      - name: Record reproducible analysis benchmark
        run: python tests/benchmark_analysis.py /bin/ls --arch arm64 --repeat 3 --output /tmp/rdis-benchmark.json
      - name: Show benchmark artifact in CI log
        run: cat /tmp/rdis-benchmark.json
      - name: Run execution-checked decompiler maturity suite
        run: python tests/maturity.py
      - name: Stress multi-visitor isolation and deterministic analysis
        run: |
          rdis-gui --multi-user --host 127.0.0.1 --port 8781 --no-open >/tmp/rdis-server.log 2>&1 &
          server_pid=$!
          (while kill -0 "$server_pid" 2>/dev/null; do
            ps -o rss= -p "$server_pid" >>/tmp/rdis-server-rss.log
            sleep 1
          done) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8781/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/rdis-server.log; exit 1; fi
          if ! python tests/concurrency_test.py http://127.0.0.1:8781; then
            cat /tmp/rdis-server.log
            echo "Server RSS samples (KiB):"
            cat /tmp/rdis-server-rss.log || true
            exit 1
          fi
